version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Raw sales data
        loaded_at_field: "CAST(date_date AS TIMESTAMP)"
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 365, period: day}
        columns:
          - name: orders_id
            description: Order identifier
          - name: pdt_id
            description: Product identifier

      - name: product
        identifier: raw_gz_product
        description: Raw product master data
        columns:
          - name: products_id
            description: Primary key
            tests: [not_null, unique]

      - name: ship
        identifier: raw_gz_ship
        description: Raw shipping data
        columns:
          - name: orders_id
            description: Primary key
            tests: [not_null, unique]

      - name: adwords
        identifier: raw_gz_adwords
        description: Google Adwords raw campaign data

      - name: bing
        identifier: raw_gz_bing
        description: Bing Ads raw campaign data

      - name: criteo
        identifier: raw_gz_criteo
        description: Criteo Ads raw campaign data

      - name: facebook
        identifier: raw_gz_facebook
        description: Facebook Ads raw campaign data

models:
  - name: int_sales_margin
    description: Product-level sales with purchase_cost and margin.
    columns:
      - name: orders_id
        description: Foreign key to identify the order.
        tests: [not_null]
      - name: products_id
        description: Product identifier.
        tests: [not_null]
      - name: margin
        description: Revenue minus purchase_cost.
        tests: [not_null]

  - name: int_orders_margin
    description: Order-level aggregated margins.
    columns:
      - name: orders_id
        description: Primary key of this table (one row per order).
        tests: [not_null, unique]
      - name: revenue
        description: Total revenue per order.
        tests: [not_null]
      - name: purchase_cost
        description: Total purchase cost per order.
        tests: [not_null]
      - name: margin
        description: Margin per order (revenue – purchase_cost).
        tests: [not_null]

  - name: int_orders_operational
    description: Order-level operational margin.
    columns:
      - name: orders_id
        description: Primary key of this table (one row per order).
        tests: [not_null, unique]
      - name: operational_margin
        description: Operational margin per order.
        tests: [not_null]

  - name: finance_days
    description: Daily finance KPIs for reporting.
    columns:
      - name: date
        description: Calendar date (grain of this table).
        tests: [not_null]
      - name: total_transactions
        description: Count of distinct orders in the day.
        tests: [not_null]
      - name: total_revenue
        description: Sum of revenue across orders in the day.
        tests: [not_null]
      - name: average_basket
        description: Average revenue per order.
      - name: operational_margin
        description: Sum of operational margins for the day.
      - name: total_purchase_cost
        description: Sum of purchase costs across orders.
        tests: [not_null]
      - name: total_shipping_fees
        description: Sum of shipping fees charged to customers.
      - name: total_log_costs
        description: Sum of logistics costs across orders.
      - name: total_quantity
        description: Total products sold in the day.
        tests: [not_null]

  - name: int_campaigns
    description: Unified campaigns table combining Adwords, Bing, Criteo, and Facebook.
    columns:
      - name: date_date
        description: Date of the campaign record.
        tests: [not_null]
      - name: paid_source
        description: Source platform (adwords, bing, criteo, facebook).
        tests: [not_null]
      - name: campaign_key
        description: Campaign unique identifier.
        tests: [not_null]
      - name: campaign_na_

